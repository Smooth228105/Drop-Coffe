services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drop_coffee_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
      SERVE_MEDIA: "True"
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/categories/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drop_coffee_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
  media_data:
  static_data:
